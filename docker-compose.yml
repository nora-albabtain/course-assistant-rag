services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data            # drop your own course PDFs here
      - index:/app/storage          # persisted FAISS index
      - hf-cache:/app/.cache        # cached embedding model

  ui:
    build: .
    command: ["streamlit", "run", "app/ui.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  index:
  hf-cache:
